<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        .photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .photo-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            width: 200px;
            text-align: center;
        }
        .photo-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        .photo-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }
        .photo-card p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }
        .photo-card .tags {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="photo-container">
        {% for photo in photos %}
        <div class="photo-card">
            <a href="{{ photo.url }}">
                <img src="{{ photo.url }}" alt="{{ photo.title }}">
            </a>
            <h3>{{ photo.title }}</h3>
            <p>{{ photo.description }}</p>
            <p><strong>Photo ID:</strong> {{ photo.photo_id }}</p>
            <p><strong>Created:</strong> {{ photo.creation_time }}</p>
            <div class="tags">
                <strong>Tags:</strong>
                {% for tag in photo.tags %}
                    <span>{{ tag }}</span>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
